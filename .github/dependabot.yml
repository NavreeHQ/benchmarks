version: 2
updates:
  - package-ecosystem: cargo
    directory: /frameworks/navree
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "navree*"
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
