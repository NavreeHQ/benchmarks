# The benchmark app builds against the published crate, and the harness parses.
# The measurement itself needs a large machine and is run by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Benchmark app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frameworks/navree
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: frameworks/navree
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked

  harness:
    name: Harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Syntax check
        run: |
          for file in run.mjs tools/conformance.mjs tools/fixtures.mjs; do node --check "$file"; done
      - name: Results parse
        run: |
          for file in $(find results -name '*.json'); do node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"; done
      - name: Dockerfile builds the load generator
        run: docker build --tag navree-bench-wrk wrk
